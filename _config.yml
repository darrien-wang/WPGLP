# Site settings
title: "WPGLP 仓库管理系统"
description: "WPLA13分拣仓调度和托盘回流管理标准作业程序"
baseurl: "/WPGLP"
url: "https://darrien-wang.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
remote_theme: pages-themes/cayman@v0.2.0

# Kramdown settings
kramdown:
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO
author: "Darrien Wang"

# Disable service worker for local development
exclude:
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
